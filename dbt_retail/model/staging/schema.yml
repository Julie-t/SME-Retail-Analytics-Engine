version: 2

sources:
  - name: raw
    schema: raw
    description: Raw source-faithful and canonical tables loaded from the local Kaggle dataset.
    tables:
      - name: raw_products
        description: >
          Canonical adapter for product_info.csv. Product IDs, brand/name, category hierarchy,
          ingredient text, listed price, product rating, aggregate review count, popularity
          counts, and available source flags are mapped without joining review-grain rows.
        columns:
          - name: id
            description: Source product_info.csv product_id; never generated by the adapter.
            tests:
              - not_null
              - unique
          - name: category
            description: Source primary_category retained as an open category value.
          - name: secondary_category
            description: Source secondary_category, retained when supplied.
          - name: tertiary_category
            description: Source tertiary_category, retained when supplied.
          - name: ingredients
            description: Original source ingredient text; not presumed to be JSON.
      - name: sephora_product_info
        description: >
          Source-faithful all-text copy of product_info.csv, one row per source product record.
        columns:
          - name: product_id
            description: Source product identifier from product_info.csv.
            tests:
              - not_null
              - unique
      - name: sephora_reviews
        description: >
          Source-faithful all-text review rows from the discovered review CSV inventory, with
          source_filename provenance. Review grain is one source row; duplicates and orphan
          product references are retained and reported in the ingestion manifest.
        columns:
          - name: column00
            description: >
              DuckDB name for the blank first header cell. Values repeat across files and are
              not treated as globally unique review identifiers.
          - name: product_id
            description: Source product foreign key; orphan values are preserved and counted.
            tests:
              - not_null
          - name: rating
            description: Individual review rating, not the product-level aggregate rating.
          - name: is_recommended
            description: Source review recommendation value retained as text; parse diagnostics allow boolean strings and numeric zero/one.
          - name: source_filename
            description: Name of the input review CSV containing this source row.
      - name: sephora_ingestion_manifest
        description: >
          One row per loaded input file with byte size, SHA-256, row count, dataset identity,
          load mode, validation counts, review inventory, download timestamp, and source path.
          Completion describes whether the discovered product/review input inventory was loaded;
          orphan review
          product IDs and duplicate review rows are reported separately and are not discarded.
        columns:
          - name: source_filename
            tests:
              - not_null
          - name: sha256
            tests:
              - not_null
          - name: row_count
            tests:
              - not_null
          - name: downloaded_at
            description: Download timestamp from download_manifest.json; null when the source was not downloaded by this tool.
          - name: source_directory
            description: Resolved local directory containing the input CSV files.
          - name: expected_review_files_json
            description: JSON array of review filenames expected by the download manifest or discovered at ingestion.
            tests:
              - not_null
          - name: missing_review_files_json
            description: JSON array of expected review files missing from the local source inventory.
            tests:
              - not_null
          - name: complete_product_and_review_ingestion
            description: True when the complete discovered product and review inventory was loaded and parsed.
            tests:
              - not_null

models:
  - name: stg_raw_products
    description: >
      Bronze product-grain view over the canonical Kaggle adapter. The primary category is
      normalized only for case and surrounding whitespace; all category levels remain available,
      and no closed API taxonomy is applied. Product-level rating and aggregate review count
      remain separate from review-row ratings.
    columns:
      - name: product_id
        description: Source product identifier; one row per product source record.
        tests:
          - not_null
          - unique
      - name: source_category
        description: Original primary_category value from product_info.csv.
      - name: category
        description: Lowercase trimmed primary_category; categories remain open-ended.
      - name: primary_category
        description: Original source primary_category.
      - name: secondary_category
        description: Original source secondary_category.
      - name: tertiary_category
        description: Original source tertiary_category.
      - name: ingredients_raw
        description: Original ingredient text. No JSON or delimiter structure is assumed.
      - name: price_usd
        description: Typed listed product price in USD; not a transaction price.
      - name: product_rating
        description: Typed product-level aggregate rating, not an individual review rating.
      - name: aggregate_review_count
        description: Typed product-level source aggregate; not the number of loaded review rows.
      - name: loves_count
        description: Popularity signal; not a sales count.
      - name: category_missing
        description: True when source primary_category is null, empty, or whitespace-only.
        tests:
          - not_null
      - name: duplicate_product_id
        description: Duplicate source product ID diagnostic; ingestion rejects duplicate IDs.
        tests:
          - not_null
      - name: duplicate_brand_name_candidate
        description: Repeated normalized brand/name candidate; records are retained.
        tests:
          - not_null

  - name: stg_raw_reviews
    description: >
      Review-source-row-grain typed adapter. Raw source columns remain available in
      raw.sephora_reviews; this model excludes reviewer IDs and profile attributes from the
      analytics layer. Ratings are valid only from 1 through 5, recommendation accepts numeric
      zero/one or boolean text, and source dates are parsed as dates. Duplicate flags indicate
      candidate rows only and do not remove records.
    columns:
      - name: product_id
        description: Trimmed source product ID; null and orphan values are retained diagnostically.
      - name: rating_raw
        description: Trimmed source rating text.
      - name: rating
        description: Parsed individual review rating; null for missing or unparsable source values.
      - name: rating_valid
        description: True only for numeric ratings from 1 through 5.
        tests:
          - not_null
      - name: rating_missing
        description: True when the source rating is null, empty, or whitespace-only.
        tests:
          - not_null
      - name: rating_invalid
        description: True for a non-empty rating that cannot parse or is outside 1 through 5.
        tests:
          - not_null
      - name: recommendation_missing
        description: True when the source recommendation value is blank.
        tests:
          - not_null
      - name: recommendation_invalid
        description: True for a non-empty recommendation value that is not boolean or numeric zero/one.
        tests:
          - not_null
      - name: is_recommended
        description: Parsed recommendation value; null when missing or invalid.
      - name: helpfulness
        description: >
          Parsed source ratio. For rows with feedback votes, validated against
          positive_feedback_count / total_feedback_count within 0.000001.
      - name: total_feedback_count
        description: Parsed total helpfulness feedback votes on the review.
      - name: positive_feedback_count
        description: Parsed positive helpfulness feedback votes on the review.
      - name: negative_feedback_count
        description: Parsed negative helpfulness feedback votes on the review.
      - name: has_feedback
        description: True when the source row records at least one feedback vote.
        tests:
          - not_null
      - name: feedback_counts_valid
        description: >
          True when all three feedback counts are non-negative and total equals positive plus
          negative counts.
        tests:
          - not_null
      - name: helpfulness_valid
        description: >
          True when helpfulness is null for zero feedback or matches positive votes divided by
          total feedback votes for positive-feedback rows.
        tests:
          - not_null
      - name: helpfulness_missing
        description: True when feedback votes exist but the source helpfulness ratio is absent.
        tests:
          - not_null
      - name: helpfulness_invalid
        description: True when helpfulness is out of range or inconsistent with vote counts.
        tests:
          - not_null
      - name: submission_date
        description: Parsed source submission date.
      - name: submission_time_missing
        description: True when the source date is missing or cannot be parsed.
        tests:
          - not_null
      - name: review_text_missing
        description: True when review text is missing or blank.
        tests:
          - not_null
      - name: review_title_missing
        description: True when review title is missing or blank.
        tests:
          - not_null
      - name: duplicate_review_candidate
        description: >
          Review rows sharing product, author, rating, recommendation, date, text, and title.
          Candidates are retained and may include legitimate repeated submissions.
        tests:
          - not_null
